[project]
name = "eu-tech-labour-observatory"
version = "0.1.0"
description = "Open longitudinal record of technology-level demand and posting survival across European public job-vacancy sources."
readme = "SCRAPERS.md"
requires-python = ">=3.12,<3.13"
license = { file = "LICENSE" }
dependencies = [
    "httpx>=0.27",
    "beautifulsoup4>=4.12",
    "lxml>=5",
    "duckdb>=1.0",
    "pydantic>=2.10",
    "structlog>=24.4",
    "pyarrow>=18",
]

[tool.uv]
package = false

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.9", "mypy>=1.14", "respx>=0.21"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.12"
strict = true
explicit_package_bases = true
exclude = ["transform/", "site/", "\\.venv/"]

[[tool.mypy.overrides]]
module = ["pyarrow", "pyarrow.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
