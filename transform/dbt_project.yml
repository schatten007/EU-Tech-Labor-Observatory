name: observatory
version: "0.1.0"
profile: observatory
config-version: 2

model-paths: ["models"]
macro-paths: ["macros"]
target-path: "target"
clean-targets: ["target", "dbt_packages"]

# ponytail: no vars, no seeds, no snapshots. dbt snapshots diff rows PRESENT in the
# source and handle absence badly, which is precisely the event this project measures.
# History is append-only observation partitions + derived event log instead.

models:
  observatory:
    staging:
      +materialized: view
