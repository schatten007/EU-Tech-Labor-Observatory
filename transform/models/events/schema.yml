version: 2

models:
  - name: posting_events
    description: >
      Presence and closure event log. Source-reported removal wins; otherwise closure is
      inferred at the first later complete source snapshot where a posting is absent.
      Each (source, observed_at) must therefore represent a complete source sweep.
    config:
      contract:
        enforced: true
    columns:
      - name: source
        data_type: varchar
      - name: source_id
        data_type: varchar
      - name: event_at
        data_type: timestamp
      - name: event_type
        data_type: varchar
        description: presence or closure.
      - name: event_basis
        data_type: varchar
        description: observed, source_reported, or inferred_absence.
