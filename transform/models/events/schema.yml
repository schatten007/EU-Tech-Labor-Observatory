version: 2

models:
  - name: posting_events
    description: Presence and closure events; inferred absence uses a later complete same-scope sweep.
    config:
      contract:
        enforced: true
    columns:
      - {name: source, data_type: varchar, data_tests: [not_null]}
      - {name: scope_id, data_type: varchar, data_tests: [not_null]}
      - {name: hmac_key_version, data_type: varchar, data_tests: [not_null]}
      - {name: source_id, data_type: varchar, data_tests: [not_null]}
      - {name: sweep_id, data_type: varchar, data_tests: [not_null]}
      - {name: event_at, data_type: timestamp, data_tests: [not_null]}
      - {name: event_type, data_type: varchar, data_tests: [not_null]}
      - {name: event_basis, data_type: varchar, data_tests: [not_null]}
