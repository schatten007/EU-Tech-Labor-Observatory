version: 2

models:
  - name: latest_complete_sweeps
    description: Latest valid complete sweep per source and scope, including zero-row sweeps.
    config:
      contract:
        enforced: true
    columns:
      - {name: source, data_type: varchar, data_tests: [not_null]}
      - {name: scope_id, data_type: varchar, data_tests: [not_null]}
      - {name: partition_id, data_type: varchar, data_tests: [not_null]}
      - {name: sweep_id, data_type: varchar, data_tests: [not_null]}
      - {name: run_id, data_type: varchar, data_tests: [not_null]}
      - {name: observed_at, data_type: timestamp, data_tests: [not_null]}
      - {name: started_at, data_type: timestamp, data_tests: [not_null]}
      - {name: completed_at, data_type: timestamp, data_tests: [not_null]}
      - {name: status, data_type: varchar, data_tests: [not_null]}
      - {name: row_count, data_type: bigint, data_tests: [not_null]}
      - {name: hmac_key_version, data_type: varchar, data_tests: [not_null]}
      - {name: source_version, data_type: varchar}
      - {name: licence_reference, data_type: varchar}
      - {name: access_method, data_type: varchar}
      - {name: approval_status, data_type: varchar}
      - {name: expected_country, data_type: varchar}
      - {name: freshness_threshold_hours, data_type: integer}
      - {name: coverage_limitations, data_type: varchar}
      - {name: reference_hashes, data_type: varchar}
      - {name: nuts_version, data_type: varchar}
      - {name: jobtech_taxonomy_version, data_type: varchar}
      - {name: esco_version, data_type: varchar}

  - name: source_coverage
    description: Deterministic source-level coverage and freshness for complete sweeps.
    config:
      contract:
        enforced: true
    columns:
      - {name: source, data_type: varchar, data_tests: [not_null]}
      - {name: scope_id, data_type: varchar, data_tests: [not_null]}
      - {name: sweep_id, data_type: varchar, data_tests: [not_null]}
      - {name: country, data_type: varchar}
      - {name: observed_at, data_type: timestamp, data_tests: [not_null]}
      - {name: expected_rows, data_type: bigint, data_tests: [not_null]}
      - {name: observed_rows, data_type: bigint, data_tests: [not_null]}
      - {name: source_version, data_type: varchar}
      - {name: licence_reference, data_type: varchar}
      - {name: access_method, data_type: varchar}
      - {name: approval_status, data_type: varchar}
      - {name: freshness_threshold_hours, data_type: integer}
      - {name: coverage_limitations, data_type: varchar}
      - {name: freshness_age_hours, data_type: double}
      - {name: freshness_status, data_type: varchar, data_tests: [not_null, accepted_values: {arguments: {values: [fresh, stale, unknown]}}]}
      - {name: coverage_status, data_type: varchar, data_tests: [not_null, accepted_values: {arguments: {values: [covered, invalid, unknown_metadata]}}]}

  - name: labour_demand_latest
    description: Posting counts and full collection provenance for the latest complete sweep.
    config:
      contract:
        enforced: true
    columns:
      - {name: source, data_type: varchar, data_tests: [not_null]}
      - {name: scope_id, data_type: varchar, data_tests: [not_null]}
      - {name: partition_id, data_type: varchar, data_tests: [not_null]}
      - {name: sweep_id, data_type: varchar, data_tests: [not_null]}
      - {name: run_id, data_type: varchar, data_tests: [not_null]}
      - {name: country, data_type: varchar}
      - {name: observed_at, data_type: timestamp, data_tests: [not_null]}
      - {name: started_at, data_type: timestamp, data_tests: [not_null]}
      - {name: completed_at, data_type: timestamp, data_tests: [not_null]}
      - {name: status, data_type: varchar, data_tests: [not_null]}
      - {name: hmac_key_version, data_type: varchar, data_tests: [not_null]}
      - {name: source_version, data_type: varchar, data_tests: [not_null]}
      - {name: licence_reference, data_type: varchar, data_tests: [not_null]}
      - {name: access_method, data_type: varchar, data_tests: [not_null]}
      - {name: approval_status, data_type: varchar, data_tests: [not_null]}
      - {name: coverage_limitations, data_type: varchar, data_tests: [not_null]}
      - {name: freshness_age_hours, data_type: double, data_tests: [not_null]}
      - {name: freshness_status, data_type: varchar, data_tests: [not_null]}
      - {name: coverage_status, data_type: varchar, data_tests: [not_null]}
      - {name: active_postings, data_type: bigint, data_tests: [not_null]}

  - name: dimension_demand_latest
    description: Latest mapped posting counts by NUTS region and ESCO occupation.
    config: {contract: {enforced: true}}
    columns: &dimension_columns
      - {name: source, data_type: varchar, data_tests: [not_null]}
      - {name: scope_id, data_type: varchar, data_tests: [not_null]}
      - {name: sweep_id, data_type: varchar, data_tests: [not_null]}
      - {name: observed_at, data_type: timestamp, data_tests: [not_null]}
      - {name: dimension, data_type: varchar, data_tests: [not_null]}
      - {name: value_uri, data_type: varchar, data_tests: [not_null]}
      - {name: value_label, data_type: varchar, data_tests: [not_null]}
      - {name: taxonomy_version, data_type: varchar, data_tests: [not_null]}
      - {name: posting_count, data_type: bigint, data_tests: [not_null]}

  - name: skill_demand_latest
    description: Latest mapped posting counts by ESCO skill.
    config: {contract: {enforced: true}}
    columns: *dimension_columns

  - name: requirement_demand_latest
    description: Latest posting counts by employment type, working-hours type, and contract duration, with every posting in exactly one row per dimension.
    config: {contract: {enforced: true}}
    columns:
      - {name: source, data_type: varchar, data_tests: [not_null]}
      - {name: scope_id, data_type: varchar, data_tests: [not_null]}
      - {name: sweep_id, data_type: varchar, data_tests: [not_null]}
      - {name: observed_at, data_type: timestamp, data_tests: [not_null]}
      # Both vocabularies are pinned, because 13a's lesson is that an unpinned vocabulary cannot be
      # audited: a renamed dimension or a typo'd status in scripts/enrich.py would publish silently.
      - {name: dimension, data_type: varchar, data_tests: [not_null, accepted_values: {arguments: {values: [employment_type, working_hours_type, duration]}}]}
      # Nullable on purpose: the `Not stated` row is a posting whose source concept_id was empty,
      # so it has no code to publish. Its label and status carry the fact instead.
      - {name: value_code, data_type: varchar}
      - {name: value_label, data_type: varchar, data_tests: [not_null]}
      - {name: mapping_status, data_type: varchar, data_tests: [not_null, accepted_values: {arguments: {values: [mapped, unmapped, not_present]}}]}
      - {name: posting_count, data_type: bigint, data_tests: [not_null]}

  - name: mapping_quality_latest
    description: Latest mapping outcome counts by dimension and status.
    config: {contract: {enforced: true}}
    columns:
      - {name: source, data_type: varchar, data_tests: [not_null]}
      - {name: scope_id, data_type: varchar, data_tests: [not_null]}
      - {name: sweep_id, data_type: varchar, data_tests: [not_null]}
      - {name: dimension, data_type: varchar, data_tests: [not_null]}
      - {name: mapping_status, data_type: varchar, data_tests: [not_null]}
      # Pinned because the point of a distinct method is auditability, and an unpinned vocabulary
      # cannot be audited: a typo in scripts/enrich.py would otherwise publish silently.
      - {name: mapping_method, data_type: varchar, data_tests: [not_null, accepted_values: {arguments: {values: [municipality_crosswalk, municipality_prefix_crosswalk, region_crosswalk, crosswalk, manual_review, exact_match_tiebreak, no_match, source_absent]}}]}
      - {name: mapping_confidence, data_type: varchar}
      - {name: taxonomy_version, data_type: varchar, data_tests: [not_null]}
      - {name: outcome_count, data_type: bigint, data_tests: [not_null]}
      - {name: total_outcomes, data_type: hugeint, data_tests: [not_null]}

  - name: mapping_coverage_latest
    description: Posting-level mapping coverage per dimension for the latest complete sweep, as the denominator for every ranking.
    config: {contract: {enforced: true}}
    columns:
      - {name: source, data_type: varchar, data_tests: [not_null]}
      - {name: scope_id, data_type: varchar, data_tests: [not_null]}
      - {name: sweep_id, data_type: varchar, data_tests: [not_null]}
      - {name: dimension, data_type: varchar, data_tests: [not_null, accepted_values: {arguments: {values: [region, occupation, skill]}}]}
      - {name: postings_total, data_type: bigint, data_tests: [not_null]}
      - {name: postings_with_source_value, data_type: bigint, data_tests: [not_null]}
      - {name: postings_mapped, data_type: bigint, data_tests: [not_null]}
      - {name: taxonomy_version, data_type: varchar, data_tests: [not_null]}

  - name: posting_survival
    description: Posting survival duration and closure-basis breakdown per source and scope, with small-count suppression.
    config:
      contract:
        enforced: true
    columns:
      - {name: source, data_type: varchar, data_tests: [not_null]}
      - {name: scope_id, data_type: varchar, data_tests: [not_null]}
      - {name: lifecycle_status, data_type: varchar, data_tests: [not_null, accepted_values: {arguments: {values: [active, source_reported, inferred_absence]}}]}
      - {name: is_suppressed, data_type: boolean, data_tests: [not_null]}
      - {name: any_right_censored, data_type: boolean, data_tests: [not_null]}
      - {name: posting_count, data_type: bigint}
      - {name: advertised_vacancies, data_type: bigint}
      - {name: median_duration_days, data_type: double}
      - {name: p25_duration_days, data_type: double}
      - {name: p75_duration_days, data_type: double}
      - {name: max_duration_days, data_type: bigint}

  - name: posting_flows
    description: Posting openings, active stock, and closures over time (day/week/month) per source and scope, with small-count suppression.
    config:
      contract:
        enforced: true
    columns:
      - {name: source, data_type: varchar, data_tests: [not_null]}
      - {name: scope_id, data_type: varchar, data_tests: [not_null]}
      - {name: grain, data_type: varchar, data_tests: [not_null, accepted_values: {arguments: {values: [day, week, month]}}]}
      - {name: bucket_start, data_type: timestamp, data_tests: [not_null]}
      - {name: is_suppressed, data_type: boolean, data_tests: [not_null]}
      - {name: openings, data_type: bigint}
      - {name: closures, data_type: bigint}
      - {name: active_postings, data_type: bigint}
      - {name: active_vacancies, data_type: bigint}

  - name: collection_frequency
    description: Collection cadence and comparability metadata per source and scope.
    config:
      contract:
        enforced: true
    columns:
      - {name: source, data_type: varchar, data_tests: [not_null]}
      - {name: scope_id, data_type: varchar, data_tests: [not_null]}
      - {name: complete_sweeps, data_type: bigint, data_tests: [not_null]}
      - {name: first_observed_at, data_type: timestamp, data_tests: [not_null]}
      - {name: last_observed_at, data_type: timestamp, data_tests: [not_null]}
      - {name: median_interval_hours, data_type: double}
      - {name: freshness_threshold_hours, data_type: integer}
      - {name: coverage_limitations, data_type: varchar}
