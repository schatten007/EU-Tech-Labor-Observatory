version: 2

sources:
  - name: observations
    description: >
      Sanitized collector output. OBSERVATIONS_PATH may select an ignored private
      NDJSON collection; the committed synthetic sample keeps checks offline.
    meta:
      external_location: "read_json_auto('{{ env_var('OBSERVATIONS_PATH', 'data/sample/postings_sample.ndjson') }}', format='newline_delimited')"
    tables:
      - name: postings

models:
  - name: stg_postings
    description: >
      Source-agnostic posting observation. This contract is unchanged from Phase 0;
      staging now reads sanitized collector output rather than source-native sample data.
    config:
      contract:
        enforced: true
    columns:
      - name: source
        data_type: varchar
        data_tests: [not_null]
        description: Source system key. Determines what may be published (PROVENANCE.md).
      - name: source_id
        data_type: varchar
        data_tests: [not_null]
        description: HMAC-pseudonymized native id. Stable longitudinal join key.
      - name: observed_at
        data_type: timestamp
        data_tests: [not_null]
        description: When WE saw this record. Never derived from source dates.
      - name: first_published
        data_type: timestamp
        description: Source-reported first publication.
      - name: last_modified
        data_type: timestamp
        description: Source-reported last modification.
      - name: removed_at
        data_type: timestamp
        description: >
          Source-reported closure. Populated by Sweden only. This is the ground truth
          that calibrates inferred closure; null elsewhere means unknown, NOT still open.
      - name: nuts_code
        data_type: varchar
        description: NUTS 2024. Null until the source's own codes are crosswalked.
      - name: country
        data_type: varchar
        data_tests: [not_null]
      - name: esco_occupation_uri
        data_type: varchar
        description: ESCO occupation URI. Pre-coded by EURES; derived for other sources.
      - name: lang
        data_type: varchar
