version: 2

sources:
  - name: manifests
    description: Sweep metadata; only complete and internally consistent sweeps are eligible downstream.
    meta:
      external_location: "read_json_auto('{{ env_var('MANIFESTS_PATH', 'data/sample/sweeps_sample.ndjson') }}', format='auto')"
    tables:
      - name: sweeps

models:
  - name: stg_collection_manifests
    description: Valid complete collection sweeps, including successful zero-row sweeps.
    config:
      contract:
        enforced: true
    columns:
      - {name: source, data_type: varchar, data_tests: [not_null]}
      - {name: scope_id, data_type: varchar, data_tests: [not_null]}
      - {name: scope_hash, data_type: varchar, data_tests: [not_null]}
      - {name: scope_json, data_type: varchar, data_tests: [not_null]}
      - {name: partition_id, data_type: varchar, data_tests: [not_null]}
      - {name: sweep_id, data_type: varchar, data_tests: [not_null, unique]}
      - {name: run_id, data_type: varchar, data_tests: [not_null]}
      - {name: observed_at, data_type: timestamp, data_tests: [not_null]}
      - {name: started_at, data_type: timestamp, data_tests: [not_null]}
      - {name: completed_at, data_type: timestamp, data_tests: [not_null]}
      - {name: status, data_type: varchar, data_tests: [not_null, accepted_values: {arguments: {values: [complete]}}]}
      - {name: expected_pages, data_type: integer, data_tests: [not_null]}
      - {name: completed_pages, data_type: integer, data_tests: [not_null]}
      - {name: expected_rows, data_type: bigint, data_tests: [not_null]}
      - {name: row_count, data_type: bigint, data_tests: [not_null]}
      - {name: hmac_key_version, data_type: varchar, data_tests: [not_null]}
      - {name: source_version, data_type: varchar}
      - {name: licence_reference, data_type: varchar}
      - {name: access_method, data_type: varchar}
      - {name: approval_status, data_type: varchar}
      - {name: expected_country, data_type: varchar}
      - {name: freshness_threshold_hours, data_type: integer}
      - {name: coverage_limitations, data_type: varchar}

  - name: stg_postings
    description: Privacy-safe posting observations admitted only through a complete matching sweep.
    config:
      contract:
        enforced: true
    columns:
      - {name: source, data_type: varchar, data_tests: [not_null]}
      - {name: source_id, data_type: varchar, data_tests: [not_null]}
      - {name: scope_id, data_type: varchar, data_tests: [not_null]}
      - {name: sweep_id, data_type: varchar, data_tests: [not_null]}
      - {name: hmac_key_version, data_type: varchar, data_tests: [not_null]}
      - {name: observed_at, data_type: timestamp, data_tests: [not_null]}
      - {name: first_published, data_type: timestamp}
      - {name: last_modified, data_type: timestamp}
      - {name: removed_at, data_type: timestamp}
      - {name: nuts_code, data_type: varchar}
      - {name: country, data_type: varchar, data_tests: [not_null, accepted_values: {arguments: {values: [DE, SE]}}]}
      - {name: esco_occupation_uri, data_type: varchar}
      - {name: lang, data_type: varchar}
